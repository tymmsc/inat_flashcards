<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iNaturalist Flashcards</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

</head>
<body>
    <h1>iNaturalist Flashcards</h1>
    <form id="flashcard-form">
       <!--  <label for="group">Select Group:</label>
       <select id="group">
            <option value="amphibia">Amphibia</option>
            <option value="reptilia">Reptilia</option>
            <option value="mammalia">Mammalia</option>
        </select>-->

        <label for="taxon-search">Search for Taxon:</label>

        <div class="centered-container">
        <div class="input-container">
            <input type="text" id="taxon-search" placeholder="Seach for a taxon...">
            <input type="hidden" id="taxon-search-id">
            <ul id="suggestions" class="suggestions-dropdown"></ul>
        </div>

        <label for="taxon-search">Search in Location:</label>
        <div class="input-container">
            <input id="location-search" type="text" placeholder="Search for a location...">
            <input type="hidden" id="location-search-id">
            <ul id="suggestions-loc" class="suggestions-dropdown"></ul>
        </div>
        </div>
<!----
        <div class="lat-long-container">
            <label for="nelat">NE Lat.:</label>
            <input type="text" id="nelat" value="26.911318201735867">

            <label for="nelng">NE Long.:</label>
            <input type="text" id="nelng" value="128.51032873640148">
        </div>


        <div class="lat-long-container">

            <label for="swlat">SW Lat.:</label>
            <input type="text" id="swlat" value="25.99658667274922">

            <label for="swlng">SW Long.:</label>
            <input type="text" id="swlng" value="127.5407852793702">
        </div>-->

        <label for="max-per-species">Max per Species:</label>
        <input type="number" id="max-per-species" placeholder="e.g., 5">

        <button id = "generate">Generate</button>
    </form>

    <p id="showing-message"></p>
    <!--<p>API Query: <span id="api-url"></span></p>-->

   <div id="flashcards-container" style="display:none;">
        <div id="flashcard">
            <div id="flashcard-images" class="image-container" src="" alt="Flashcard Image"></div>
            <button id="show-button">Show name</button>
            <div id="flashcard-name" style="display:none;">
                <p id="common-name"></p>
                <p id="scientific-name"></p>
            </div>

        <button id="correct" disabled>Correct</button>
        <button id="incorrect" disabled >Incorrect</button>
        <div id="progress">
            <p id="learned-count">Learned: 0</p>
            <p id="remaining-count">Remaining: 0</p>
        </div>
        </div>
    </div>





    <p># Species: <span id="total-results"></span></p>

    <table id="species-table" cellpadding="4">
        <thead>
          <tr>
            <th>Scientific Name</th>
            <th>Common Name</th>
          </tr>
        </thead>
        <tbody id="species-tbody"></tbody>
      </table>

      <p></p>
      <div id="tree-container"  class="tree-container"></div>







    <script src="scripts.js"></script>
</body>
</html>
