<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iNaturalist Flashcard Creator</title>
  <link rel="stylesheet" href="base_styles.css" />
  <link rel="stylesheet" href="form_styles.css"/>
  <link rel="stylesheet" href="trees_styles.css"/>
  <link rel="stylesheet" href="flashcard-styles.css"/>

</head>

<body>
  <div class="main-container">
    <div class="title-container">
    </div>
     <div class="tabs-container">
          <button class="tab active" id='search-tab-button' type="button">Search</button>
          <button class="tab disabled" id="cards-tab-btn" type="button">Cards</button>
          <button class="tab disabled" id='list-tab-button' type="button">List</button>
          <button class="tab disabled" id='tree-tab-button' type="button">Tree</button>
      </div>

    <div class="content-container">
        <div class="tab-content" id="search-tab"> 
            <form id="flashcard-form" class="flashcard-form">

              <div class="form-top">

                  <div class="form-top-selector">
                      <label>
                        <input type="radio" name="topFormChoice" value="option1" checked>
                        Manual input
                      </label>
                      <label>
                        <input type="radio" name="topFormChoice" value="option2">
                        iNat address
                      </label>
                    </div>
                <hr class="divider" />

                <div class = "form-top-inner option1">
                  <div class="form-row">
                    <label for="taxon-search">Taxon name:</label>
                    <input type="text"  autocomplete="off" novalidate id="taxon-search" name="taxon-search"  placeholder="Seach for a taxon...">
                    <input type="hidden" id="taxon-search-id" name="taxon-search-id-hid">
                    <ul id="suggestions" class="suggestions-dropdown"></ul>
                  </div>
                  <div class="form-row">
                    <label for="location-search">Location:</label>
                    <input type="text" id="location-search"  autocomplete="off" novalidate name="location" placeholder="Search for a location...">
                      <input type="hidden" id="location-search-id" name="location-search-id-hid">
                      <ul id="suggestions-loc" class="suggestions-dropdown"></ul> 
                       <div id="secret-dropdown">
                      <label>Quick Location:</label>
                      <select id="location-select">
                        <option value="">Select a spot...</option>
                        <option value="nelat=10.443287687791763&nelng=-84.0086517782982&subview=map&swlat=10.38385816226446&swlng=-84.19129948337633">Sarapiqui</option>
                        <option value="nelat=10.199148528032653&nelng=-83.74735427093287&subview=map&swlat=10.143728500453944&swlng=-83.81258559417506">Centro Manu</option>
                        <option value="nelat=10.090261328923573&nelng=-83.50389457559874&subview=map&swlat=10.017242354632367&swlng=-83.57805229044249">Guayacan</option>
                        <option value="nelat=10.074827733054523&nelng=-83.57374982351104&subview=map&swlat=9.679771476992665&swlng=-83.87312726491729">Turrialba/Tapanti</option>
                        <option value="nelat=9.926542600825401&nelng=-84.06299215177995&subview=map&swlat=9.799361176084126&swlng=-84.21130758146745">Escazu</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class = "form-top-inner option2" style="display:none">
                  <div class="form-row">
                    <label for="inat-search">iNat web address:</label>
                    <input type="text"  autocomplete="off" novalidate id="inat-search" name="inat-search"  placeholder="Paste iNat address...">
                </div>

                </div>
                </div>
                <hr class="divider" />

                <div class="form-bottom">
                  <div class="form-bottom-inner">
                    <div class="form-row small-input">
                      <label for="max-per-species">Max cards per species:</label>
                      <input type="number" id="max-per-species"  value=4 autocomplete="off" novalidate name="max-per-species" min="1" />
                    </div>
                  <div class="lower button">
                      <button type="submit" id="generate-btn" class="generate-btn">Generate flashcards</button>
                      <p class="loading-text" id="error-text">***</p>
                  </div>

                </div>
                </div>
                
                </form>
        </div>

      <div class="tab-content" id="card-tab" style="display:none;"> 
            <!-- Progress at top -->
            <div id="progress">Progress: 0/10</div>

            <!-- Image container fills remaining space -->
            <div id="flashcard-images" class="image-container">
              <!-- image will go here -->
            </div>

            <!-- Revealed name text (always reserved space) -->
            <div id="flashcard-name" class="name-container">
              <p id="scientific-name">-</p>
              <p id="common-name">-</p>
            </div>

            <!-- Show name button -->
            <button id="show-button">Show name</button>
                <hr class="divider" />
            <!-- Correct / Incorrect buttons at bottom -->
            <div class="answer-buttons">
              <button id="correct" disabled>Correct</button>
              <button id="incorrect" disabled>Incorrect</button>
            </div>

        
      </div>

        <div class="tab-content" id="table-tab" style="display:none;"> 
        
            <p>Species count: <span id="total-results"></span></p>
            <table id="species-table" cellpadding="4">
                <thead>
                  <tr>
                    <th>Scientific Name</th>
                    <th>Common Name</th>
                  </tr>
                </thead>
                <tbody id="species-tbody"></tbody>
              </table>
        </div>
        <div class="tab-content" id="tree-tab" style="display:none;"> 
          <div id="tree-container"  class="tree-container"></div>

        </div>
  </div>
  </div>


  <script src="tabs_logic.js"></script>
  <script src="search_suggestions.js"></script>
    <script src="search_form.js"></script>
    <script src="flashcard_logic.js"></script>


</body>
</html>
